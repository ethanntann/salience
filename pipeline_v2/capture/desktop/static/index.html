<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-row">
      <span class="brand">SALIENCE</span>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="library">LIBRARY</a>
        <a href="#/rate" data-nav="rate">RATE <span class="badge" id="rate-badge" hidden></span></a>
        <a href="#/settings" data-nav="settings">SETTINGS</a>
      </nav>
    </div>
    <div class="status" id="recorder">
      <div class="status-text">
        <b><span class="dot" id="rec-dot"></span> <span id="rec-state">…</span></b>
        <span id="rec-detail"></span>
        <small id="status-quality"></small>
      </div>
      <div class="status-top">
        <span id="autoclip-label">AUTO-CLIP</span>
        <button class="switch" id="autoclip" role="switch" aria-checked="false" aria-labelledby="autoclip-label"><span></span></button>
      </div>
    </div>
  </header>
  <main class="page" id="page" tabindex="-1"></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
