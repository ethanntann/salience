<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#FF7A59" stroke-width="2.5"></circle><circle cx="13" cy="13" r="4" fill="#FF7A59"></circle></svg>
      Salience
    </div>
    <div class="nav">
      <a href="#/" data-nav="library">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        Library
      </a>
      <a href="#/rate" data-nav="rate">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12l4 4L19 6"></path></svg>
        Rate clips <span class="badge" id="rate-badge" hidden></span>
      </a>
      <a href="#/settings" data-nav="settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
        Settings
      </a>
    </div>
    <div class="status">
      <b><span class="dot"></span> Ready to record</b>
      <span>Starts on its own when Fortnite opens. Nothing to press.</span>
      <span id="status-quality"></span>
    </div>
  </nav>
  <main class="page" id="page" tabindex="-1"></main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
