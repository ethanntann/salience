name: CI
on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  python:
    # The product is Windows-only (Graphics Capture, WASAPI, DirectML).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: FFmpeg (26 tests cut and probe real files)
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev,audio,app]"
      - run: python -m ruff check pipeline_v2 salience_media installer
      - run: python -m pytest -q

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  audit:
    # Known vulnerabilities in exactly what the installer ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --no-deps --disable-pip -r installer/requirements.lock
