# Weekly pull requests for outdated or vulnerable dependencies. The installer's
# `requirements.lock` is updated by hand (rebuild, then run the installed app);
# CI's `pip-audit` says when one of its packages has a known vulnerability.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
